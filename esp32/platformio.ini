; Project PingPong ESP32 firmware (doc stages S9 + S10).        OWNERS: Razvi, TT
; Build:   ./dev.sh fw build      Flash:  ./dev.sh fw upload      (from the ROS2/ folder, one level up)
; or open this folder in VS Code with the PlatformIO extension.

[env:esp32dev]
platform = espressif32@6.9.0          ; Arduino core 2.0.17
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600

board_microros_distro = jazzy
board_microros_transport = serial
board_microros_user_meta = colcon.meta

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio#cfee17faffaa532363b7151dd13af6a85c69d3c1
    gin66/FastAccelStepper@0.31.8

; copies ../raspberry/src/pingpong_interfaces into extra_packages/ so the ESP32 uses the SAME messages
extra_scripts = pre:scripts/sync_interfaces.py

build_flags = -Wall
