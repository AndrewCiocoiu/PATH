# Project PingPong parameters. One block per node.
# Change values here, not in the Python files. Restart the launch file to apply
# (or at runtime: ros2 param set /<node> <name> <value>).
# Every parameter is documented next to its declare_parameter() in the node source.

camera_node:                       # Sofian
  ros__parameters:
    width: 640
    height: 480
    fps: 30.0
    horizontal_fov_deg: 54.0       # OV5647 standard lens, check yours (wide lens: more)

detector_node:                     # Sofian
  ros__parameters:
    min_pixels: 20

target_tracker_node:               # Sofian
  ros__parameters:
    alpha: 0.6
    beta: 0.1
    lost_timeout_s: 0.5
    min_confidence: 0.3

aim_solver_node:                   # Andrei
  ros__parameters:
    muzzle_speed: 7.9              # m/s, launcher_calculations.tex; measure in T19
    drag_k: 0.14                   # 1/m, 40 mm ball (0.094 for the 20 mm ball)
    yaw_offset_rad: 0.0            # from calibration T23
    pitch_offset_rad: 0.0
    use_lead: true

tracking_controller_node:          # Andrei
  ros__parameters:
    kp: 4.0
    ki: 0.5
    max_rate: 2.0
    dead_band_rad: 0.002
    search_yaw_amplitude: 1.0
    search_period_s: 8.0
    search_pitch: 0.05

mission_manager_node:              # Andrei  (doc sections 9.2 and 10)
  ros__parameters:
    confirm_frames: 5
    target_lost_s: 1.0
    aim_timeout_s: 3.0
    fire_timeout_s: 1.0
    fire:                          # fire permission, doc section 10
      min_confidence: 0.6
      min_track_age: 10
      max_aim_error_rad: 0.0087    # 0.5 deg
      min_aim_ok_cycles: 3
      range_min_m: 1.0
      range_max_m: 3.5             # spec 1-3 m; the VL53L1X gets unreliable further out
      cooldown_s: 2.0

range_node:                        # Razvi (only with sim:=false), VL53L1X on the Pi I2C bus
  ros__parameters:
    i2c_bus: 1
    rate_hz: 15.0
    distance_mode: 3               # long
    roi_spads: 4                   # 4x4 = narrowest cone, about 15 deg
    fov_deg: 15.0
    window: 5
    max_m: 4.0

mock_hw_node:                      # Razvi (only with sim:=true)
  ros__parameters:
    arm_switch: true
    magazine_balls: 5              # holder capacity, as if filled after power-up
    target_range: 2.5
    target_yaw: 0.4
    target_pitch: 0.05
    target_motion_amplitude: 0.15
    target_motion_period_s: 10.0
